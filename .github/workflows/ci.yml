name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - name: Experiments reproduce the committed results
        run: |
          vpo report --out /tmp/results
          python - <<'PY'
          import json, pathlib
          for path in sorted(pathlib.Path("results").glob("*.json")):
              fresh = json.loads((pathlib.Path("/tmp/results") / path.name).read_text())
              assert fresh == json.loads(path.read_text()), f"{path.name} drifted"
              print("reproduced", path.name)
          PY
