[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pipeline-orchestrator"
version = "0.1.0"
description = "A backpressure-aware DAG scheduler for large-scale vision pipelines with priority queues, CPU/GPU placement, retries, dead-letter handling, autoscaling signals, and end-to-end telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Asher"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vision_pipeline_orchestrator*"]
