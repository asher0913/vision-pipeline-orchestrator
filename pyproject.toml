[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pipeline-orchestrator"
version = "1.0.0"
description = "Discrete-event simulator for vision inference pipelines: DAG stages on CPU workers and batching GPUs, WIP-based backpressure with priority shedding, retries and dead-letter handling, and autoscaling with cold starts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yixuan Zhang"}]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vpo = "vpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
